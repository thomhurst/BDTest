name: Dependencies auto-merge
on:
  workflow_run:
    workflows: ['.NET']
    types: [completed]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write
  statuses: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success')
    steps:
      # All triggers have write permissions. Never check out or execute PR code here.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Merge dependencies after CI and review checks pass
        shell: pwsh
        run: ./scripts/Merge-DependencyPr.ps1 -RunId $env:CI_RUN_ID -Repo $env:GH_REPO
        env:
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
