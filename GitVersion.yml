# Versions are chosen by editing the tag of the draft release before publishing it (see
# .github/workflows/release-draft.yml), not by +semver: commit messages. GitVersion only suggests
# the draft's version: the next patch after the latest version tag, however many commits follow it.
# ModularPipelines uses this file instead of its built-in Mainline fallback, which added one patch
# per commit.
mode: ContinuousDeployment
commit-message-incrementing: Disabled
