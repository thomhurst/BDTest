# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      publish-packages:
        description: Publish packages?    
        type: boolean
        required: true

concurrency:
  # Keep package publication separate and uninterrupted; ordinary builds still supersede each other.
  group: ${{ github.workflow }}-${{ inputs.publish-packages && 'publish' || 'build' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.publish-packages }}

jobs:
  modularpipeline:
    environment: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Pull Requests' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # GitVersion's Mainline strategy fails on the synthetic PR merge commit, so build the PR branch itself
          ref: ${{ github.head_ref }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.402
      - name: Verify dependency merge safeguards
        shell: pwsh
        run: ./scripts/Test-DependencyAutomerge.ps1
      - name: Verify skip outcomes from test runners
        shell: pwsh
        run: ./scripts/Test-SkipOutcomes.ps1 -ResultsDirectory artifacts/test-results/skip-outcomes
      - name: Run Pipeline
        run: dotnet run -c Release
        working-directory: "BDTest.Pipeline"
        env:
          DOTNET_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Development' }}
          NuGet__ApiKey: ${{ secrets.NUGET__APIKEY }}
          PUBLISH_PACKAGES: ${{ github.event.inputs.publish-packages }}
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results
          path: artifacts/test-results/
          if-no-files-found: warn
      - name: Upload NuGet packages
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: warn
