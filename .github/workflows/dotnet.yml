# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    # Drafts skip every job; marking ready starts CI and converting back cancels it.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # Publishing the draft release that release-draft.yml keeps for main runs the full pipeline on
  # the release's tag and pushes the packages to NuGet, stamped with the tag's version.
  release:
    types: [published]
  workflow_dispatch:

# Jobs that need more declare it themselves.
permissions:
  contents: read

concurrency:
  # Keep package publication separate and uninterrupted; ordinary builds still supersede each other.
  group: ${{ github.workflow }}-${{ github.event_name == 'release' && 'publish' || 'build' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  filesystem-storage-macos:
    # Skip draft PRs before allocating a runner.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.402
      # Exercise Darwin's native lock-contention error, including separate processes.
      - name: Verify file-system storage on macOS
        run: dotnet run --project BDTest.Tests/BDTest.Tests.csproj -c Release -- --treenode-filter "/*/*/FileSystemReportStoreTests/*"

  modularpipeline:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    environment: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'release') && 'Production' || 'Pull Requests' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Exchanged by NuGet/login for a short-lived nuget.org API key (trusted publishing).
      id-token: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # Build the PR branch itself, not the synthetic merge commit, so GitVersion names the branch.
          # Empty outside pull requests: a release checks out its tag.
          ref: ${{ github.head_ref }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: |
            11.0.100
            10.0.402
            8.0.x
      - name: Verify dependency merge safeguards
        shell: pwsh
        run: ./scripts/Test-DependencyAutomerge.ps1
      - name: Verify auto-merge gate
        shell: pwsh
        run: ./scripts/Test-AssertPrGreenAutoMerge.ps1
      - name: Verify public API baseline enforcement
        shell: pwsh
        run: ./scripts/Test-PublicApiBaselines.ps1
      - name: Verify report controls
        run: |
          node scripts/Test-HtmlReportControls.cjs
          node --test scripts/Test-ReportDeletion.cjs
          node --test scripts/Test-ReportAttachments.cjs
      - name: Verify skip outcomes from test runners
        shell: pwsh
        run: ./scripts/Test-SkipOutcomes.ps1 -ResultsDirectory artifacts/test-results/skip-outcomes
      - name: Verify adapter conformance from test runners
        shell: pwsh
        run: ./scripts/Test-AdapterConformance.ps1 -ResultsDirectory artifacts/test-results/adapter-conformance
      - name: Verify framework cancellation from test runners
        shell: pwsh
        run: ./scripts/Test-AdapterCancellation.ps1 -ResultsDirectory artifacts/test-results/adapter-cancellation
      - name: Verify release version grammar
        shell: pwsh
        run: ./scripts/Test-ReleaseVersion.ps1
      # A release ships the version in its tag (see Get-ReleaseVersion.ps1 for the grammar), and
      # only what main has: the tag must point at a commit on main.
      - name: Verify release
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if ! version=$(pwsh -NoProfile -File scripts/Get-ReleaseVersion.ps1 -Tag "$RELEASE_TAG"); then
            echo "::error::Release tag '$RELEASE_TAG' is not a version. Use a tag such as 3.0.1, v3.1.0 or 4.0.0-beta.1."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release $RELEASE_TAG points at $GITHUB_SHA, which is not on main."
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "Release version: $version"
      - name: NuGet login
        if: github.event_name == 'release'
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Run Pipeline
        run: dotnet run -c Release
        working-directory: "BDTest.Pipeline"
        env:
          DOTNET_ENVIRONMENT: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'release') && 'Production' || 'Development' }}
          NuGet__ApiKey: ${{ steps.login.outputs.NUGET_API_KEY }}
          PUBLISH_PACKAGES: ${{ github.event_name == 'release' }}
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results
          path: artifacts/test-results/
          if-no-files-found: warn
      - name: Upload NuGet packages
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: warn

  # The draft was named, and its Full Changelog link written, for the version GitVersion suggested.
  # Follow the tag if it was edited before publishing. Only the generated Full Changelog line is
  # rewritten; other compare links in the notes are left as written. Cosmetic, so it never blocks
  # a release, and independent of the build job, so it runs whatever happens after publishing.
  # A separate job keeps write access out of the build job. It is not in ci-passed's `needs`: it
  # runs only for releases, and a skipped need would fail that check on every pull request.
  name-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Name release after its tag
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          body=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.body // ""')
          body=$(printf '%s' "$body" \
            | sed -E "s#^(\*\*Full Changelog\*\*: https://github\.com/$GITHUB_REPOSITORY/compare/[^ ]+)\.\.\.[^ ]+\$#\1...$RELEASE_TAG#")
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -f name="$version" -f body="$body" > /dev/null

  ci-passed:
    # The `main` ruleset's only required status check. List every other job in `needs`, except
    # the release-only name-release job (see above).
    # The name is an expression on purpose: GitHub evaluates a job name only when the job
    # runs, so a skipped run (a draft PR, or a run cancelled by a newer one) reports this
    # check under the raw expression text and can never satisfy the required `CI Passed`.
    # !cancelled() still runs it after a failed job, so failures report under the name.
    name: ${{ needs.modularpipeline.result != 'skipped' && 'CI Passed' || 'CI Passed (skipped)' }}
    needs: [filesystem-storage-macos, modularpipeline]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every CI job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null
