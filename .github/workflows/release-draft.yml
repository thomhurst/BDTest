name: Release Draft

# Keeps one draft release up to date with main: its tag is the version GitVersion computes for the
# newest commit (the next patch after the latest version tag, see GitVersion.yml), its target is
# that commit, and its notes list the changes since the latest release.
#
# To release, edit the draft on GitHub: change the tag to choose the version (for example 3.1.0
# for a minor or 4.0.0 for a major release; 4.0.0-beta.1 for a prerelease), adjust the notes, and
# publish it. Publishing creates the tag on the draft's commit and runs dotnet.yml, which tests and
# packs that commit with the tag's version and pushes the packages to NuGet.
#
# Every push to main rewrites the draft, so edits to it are lost if main moves before it is
# published. The draft this workflow owns carries DRAFT_MARKER in its notes; other drafts are left
# alone.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

# Only the newest commit's draft matters.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      DRAFT_MARKER: '<!-- bdtest-release-draft -->'

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.402

      # The same GitVersion.Tool version and repository GitVersion.yml the pipeline's
      # NugetVersionGeneratorModule uses (ModularPipelines' GitVersioningOptions.ToolVersion).
      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/gitversion"
          dotnet tool install --tool-path "$tools" GitVersion.Tool --version 6.8.2 > /dev/null
          version=$("$tools/dotnet-gitversion" /output json /nocache | jq -r .SemVer)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::GitVersion suggested '$version' for main; expected a release version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          repo="repos/$GITHUB_REPOSITORY"
          # Existing tags have no v prefix; a published tag may carry one.
          tag="$VERSION"

          # Notes start at the latest published release. Before the first one, they start at the
          # newest stable version tag on main, which is the version last pushed to NuGet.
          # gh prints the 404 body on stdout when there is no release yet, so discard it on failure.
          if ! previous=$(gh api "$repo/releases/latest" --jq .tag_name 2> /dev/null); then
            previous=""
          fi
          if [ -z "$previous" ]; then
            previous=$(git tag --merged HEAD --sort=-version:refname \
              | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          fi

          notes_args=(-f tag_name="$tag" -f target_commitish="$GITHUB_SHA")
          if [ -n "$previous" ]; then
            notes_args+=(-f previous_tag_name="$previous")
          fi
          notes=$(gh api -X POST "$repo/releases/generate-notes" "${notes_args[@]}" --jq .body)
          body="$notes"$'\n\n'"$DRAFT_MARKER"

          draft_ids=$(gh api --paginate "$repo/releases?per_page=100" \
            --jq '.[] | select(.draft and ((.body // "") | contains(env.DRAFT_MARKER))) | .id')
          draft_id=${draft_ids%%$'\n'*}

          if [ -n "$draft_id" ]; then
            method=PATCH
            endpoint="$repo/releases/$draft_id"
          else
            method=POST
            endpoint="$repo/releases"
          fi

          url=$(gh api -X "$method" "$endpoint" \
            -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -f name="$VERSION" \
            -F draft=true -f body="$body" --jq .html_url)

          echo "Draft release $tag for $GITHUB_SHA (previous release ${previous:-none}): $url" | tee -a "$GITHUB_STEP_SUMMARY"
