name: "CodeQL"

on:
  push:
    branches: [ main ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ main ]
    # Drafts skip every job; marking ready starts CI and converting back cancels it.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  schedule:
    - cron: '31 18 * * 4'

concurrency:
  # Pull requests cancel their own superseded analyses; push and scheduled runs keep a unique group.
  group: ${{ github.event_name == 'pull_request' && format('codeql-pr-{0}', github.event.pull_request.number) || format('codeql-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    # Skip draft PRs before allocating a runner.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript
            build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1

    - name: Setup .NET
      if: matrix.language == 'csharp'
      uses: actions/setup-dotnet@v6.0.0
      with:
        dotnet-version: 10.0.403

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Build solution
      if: matrix.build-mode == 'manual'
      run: dotnet build BDTest.sln -c Release --no-incremental

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
