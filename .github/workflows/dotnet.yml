# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    # Drafts skip every job; marking ready starts CI and converting back cancels it.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      publish-packages:
        description: Publish packages?    
        type: boolean
        required: true

concurrency:
  # Keep package publication separate and uninterrupted; ordinary builds still supersede each other.
  group: ${{ github.workflow }}-${{ inputs.publish-packages && 'publish' || 'build' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.publish-packages }}

jobs:
  filesystem-storage-macos:
    # Skip draft PRs before allocating a runner.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.402
      # Exercise Darwin's native lock-contention error, including separate processes.
      - name: Verify file-system storage on macOS
        run: dotnet run --project BDTest.Tests/BDTest.Tests.csproj -c Release -- --treenode-filter "/*/*/FileSystemReportStoreTests/*"

  modularpipeline:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    environment: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Pull Requests' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Exchanged by NuGet/login for a short-lived nuget.org API key (trusted publishing).
      id-token: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # GitVersion's Mainline strategy fails on the synthetic PR merge commit, so build the PR branch itself
          ref: ${{ github.head_ref }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: |
            10.0.402
            8.0.x
      - name: Verify dependency merge safeguards
        shell: pwsh
        run: ./scripts/Test-DependencyAutomerge.ps1
      - name: Verify auto-merge gate
        shell: pwsh
        run: ./scripts/Test-AssertPrGreenAutoMerge.ps1
      - name: Verify public API baseline enforcement
        shell: pwsh
        run: ./scripts/Test-PublicApiBaselines.ps1
      - name: Verify report controls
        run: |
          node scripts/Test-HtmlReportControls.cjs
          node --test scripts/Test-ReportDeletion.cjs
          node --test scripts/Test-ReportAttachments.cjs
      - name: Verify skip outcomes from test runners
        shell: pwsh
        run: ./scripts/Test-SkipOutcomes.ps1 -ResultsDirectory artifacts/test-results/skip-outcomes
      - name: Verify adapter conformance from test runners
        shell: pwsh
        run: ./scripts/Test-AdapterConformance.ps1 -ResultsDirectory artifacts/test-results/adapter-conformance
      - name: Verify framework cancellation from test runners
        shell: pwsh
        run: ./scripts/Test-AdapterCancellation.ps1 -ResultsDirectory artifacts/test-results/adapter-cancellation
      - name: NuGet login
        if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.publish-packages == 'true' }}
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Run Pipeline
        run: dotnet run -c Release
        working-directory: "BDTest.Pipeline"
        env:
          DOTNET_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Development' }}
          NuGet__ApiKey: ${{ steps.login.outputs.NUGET_API_KEY }}
          PUBLISH_PACKAGES: ${{ github.event.inputs.publish-packages }}
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results
          path: artifacts/test-results/
          if-no-files-found: warn
      - name: Upload NuGet packages
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: warn

  ci-passed:
    # The `main` ruleset's only required status check. List every other job in `needs`.
    # The name is an expression on purpose: GitHub evaluates a job name only when the job
    # runs, so a skipped run (a draft PR, or a run cancelled by a newer one) reports this
    # check under the raw expression text and can never satisfy the required `CI Passed`.
    # !cancelled() still runs it after a failed job, so failures report under the name.
    name: ${{ needs.modularpipeline.result != 'skipped' && 'CI Passed' || 'CI Passed (skipped)' }}
    needs: [filesystem-storage-macos, modularpipeline]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every CI job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null
